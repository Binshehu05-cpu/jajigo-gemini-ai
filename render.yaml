services:
  - type: web
    name: jajigo-gemini-ai
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: AI_RATE_LIMIT
        value: "30"
